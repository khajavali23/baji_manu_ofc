<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Banner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

</head>

<body>

<!-- HEADER -->
<div class="dashboard-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Add Banner</h5>
    <a href="/dashboard/" class="btn btn-light btn-sm">Back</a>
</div>

<div class="container">

    <div class="form-wrapper">

        <div class="form-card">

            <h5 class="form-title">Create New Banner</h5>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- TITLE -->
                <div class="mb-3">
                    <label class="form-label">Banner Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Enter banner title" required>
                </div>

                <!-- IMAGE -->
                <div class="mb-3">
                    <label class="form-label">Upload Image</label>
                    <input type="file" name="image" class="form-control" required>
                    <small class="text-muted">Recommended: 1920x800 for best display</small>
                </div>

                <!-- DESCRIPTION -->
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Enter short description"></textarea>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-save w-100">
                    Add Banner
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
