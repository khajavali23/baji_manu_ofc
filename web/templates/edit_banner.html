<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Banner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

</head>

<body>

<div class="form-wrapper">

    <div class="form-card">

        <h5 class="form-title">Edit Banner</h5>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- TITLE -->
            <div class="mb-3">
                <label class="form-label">Banner Title</label>
                <input type="text" name="title" class="form-control" value="{{ banner.title }}" required>
            </div>

            <!-- CURRENT IMAGE -->
            {% if banner.image %}
            <div class="mb-3">
                <label class="form-label">Current Image</label><br>
                <img src="{{ banner.image.url }}" alt="Banner" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px;">
            </div>
            {% endif %}

            <!-- UPLOAD NEW IMAGE -->
            <div class="mb-3">
                <label class="form-label">Upload New Image</label>
                <input type="file" name="image" class="form-control">
                <small class="text-muted">Leave empty if you don’t want to change the image</small>
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4">{{ banner.description }}</textarea>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn btn-save w-100">
                Update Banner
            </button>

        </form>

    </div>

</div>

</body>
</html>
