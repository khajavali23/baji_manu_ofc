<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Submenu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

</head>

<body>

<!-- HEADER -->
<div class="dashboard-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Add Submenu</h5>
    <a href="/dashboard/" class="btn btn-light btn-sm">Back</a>
</div>

<div class="container">

    <div class="form-wrapper">

        <div class="form-card">

            <!-- TITLE -->
            <h5 class="form-title">
                Add Submenu under: 
                <span style="color:#0D2F2A;">{{ navbar.name }}</span>
            </h5>

            <!-- FORM -->
             <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- NAME -->
                <div class="mb-3">
                    <label class="form-label">Submenu Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Cardiology" required>
                </div>

                <!-- URL -->
               <div class="mb-3">
    <label class="form-label">Upload File</label>
    <input type="file" name="file" class="form-control" required>
    <small class="text-muted">Upload PDF, DOC, Image, etc.</small>
</div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-save w-100">
                    Save Submenu
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
