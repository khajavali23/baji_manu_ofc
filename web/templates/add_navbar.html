<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Navbar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

<!-- HEADER -->
<div class="dashboard-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Add Navbar</h5>
    <a href="/dashboard/" class="btn btn-light btn-sm">Back</a>
</div>

<div class="container">

    <div class="form-wrapper">

        <div class="form-card">

            <h5 class="form-title">Create Menu Item</h5>

            <form method="POST">
                {% csrf_token %}

                <!-- NAME -->
                <div class="mb-3">
                    <label class="form-label">Menu Name</label>
                    <input 
                        type="text" 
                        name="name" 
                        class="form-control" 
                        placeholder="e.g. Services" 
                        required>
                </div>

                <!-- URL -->
                <div class="mb-3">
                    <label class="form-label">URL / Link</label>
                    <input 
                        type="text" 
                        name="url" 
                        class="form-control" 
                        placeholder="/services" 
                        required>
                    <small class="text-muted">Example: /services or /about-us</small>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-save w-100">
                    Add Navbar
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
