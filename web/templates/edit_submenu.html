<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Edit Submenu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

<div class="dashboard-header d-flex justify-content-between align-items-center">
    <h5>Edit Submenu</h5>
    <a href="/dashboard/" class="btn btn-light btn-sm">Back</a>
</div>

<div class="container">

    <div class="form-wrapper">
        <div class="form-card">

            <h5 class="form-title">Update Submenu</h5>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" value="{{ submenu.name }}" class="form-control">
                </div>

               <div class="mb-3">
    <label class="form-label">Replace File (optional)</label>
    <input type="file" name="file" class="form-control">
    <small class="text-muted">Upload new file to replace existing</small>
</div>
                <button class="btn btn-save w-100">Update</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
